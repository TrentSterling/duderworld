<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/><title>DuderWorld V0.2 — Geometry Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf0ee;color:#223443;font:13px/1.4 system-ui,Segoe UI,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
aside{position:fixed;top:18px;left:18px;width:min(320px,calc(100vw - 36px));background:#192c36ed;box-shadow:0 16px 45px #19314044;border:1px solid #91aca94d;
border-radius:18px;padding:16px;color:#e9f4ef;backdrop-filter:blur(13px)}
h1{font-size:22px;letter-spacing:-.5px;margin:0 0 2px;font-weight:900}small{font-size:10px;color:#98bec5;font-weight:750;letter-spacing:2px;text-transform:uppercase}
p{margin:6px 0 12px;color:#bacdd0;font-size:12px}#stats{background:#163c42;color:#a4fce1;padding:9px 11px;border-radius:9px;margin:12px 0;font:11px ui-monospace,monospace}
.setting{display:grid;grid-template-columns:1fr 42px;gap:5px 10px;margin:12px 0;color:#dbe7eb;font-weight:700}
.setting input{grid-column:1/3;width:100%;accent-color:#7be5d7;cursor:pointer}.setting output{text-align:right;color:#88f1d7;font-variant-numeric:tabular-nums}
.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}button{border:1px solid #6b9897;background:#24424b;color:#f6fffc;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:850;cursor:pointer;letter-spacing:.4px}
button:hover{background:#37616a}button.emph{background:#f0a38b;color:#2d3032;border-color:#ffd9c3}
.hint{color:#92b6b8;margin-top:12px;font-size:11px;line-height:1.6}
.badge{position:fixed;right:16px;bottom:15px;color:#536b73;background:#fffbeacc;border-radius:9px;padding:8px 12px;box-shadow:0 4px 15px #7893a324;font-size:11px}
@media(max-width:680px){aside{top:8px;left:8px;padding:11px;width:260px;max-height:75vh;overflow:auto}h1{font-size:18px}#stats{font-size:10px}.setting{margin:7px 0}.badge{display:none}}
</style></head><body>
<canvas id="screen" aria-label="Procedurally generated DuderWorld 3D lobby"></canvas>
<aside><small>TRONT-EOS · GEOMETRY ONLY</small><h1>DUDERWORLD <span style="color:#fbbfa7">V0.2</span></h1>
<p>A layered, entirely procedural duder lobby. Every structural and decorative piece is bakeable.</p>
<div id="stats"></div>
<label class="setting">Room width <output id="widthValue">32</output><input id="width" type="range" min="26" max="42" step="1" value="32"/></label>
<label class="setting">Room depth <output id="depthValue">24</output><input id="depth" type="range" min="20" max="34" step="1" value="24"/></label>
<label class="setting">Plaza radius <output id="plazaValue">5.7</output><input id="plaza" type="range" min="4.2" max="7" step=".1" value="5.7"/></label>
<label class="setting">Profile facets <output id="facetsValue">24</output><input id="facets" type="range" min="12" max="40" step="4" value="24"/></label>
<div class="buttons"><button id="view" class="emph">TOP DOWN</button><button id="outline">OUTLINES OFF</button>
<button id="reroll">REROLL POTS</button><button id="reset">RESET</button><button id="recipe">SAVE RECIPE</button><button id="bake" class="emph">BAKE GLB</button></div>
<div class="hint">Drag to orbit · Right-drag to pan · Scroll to zoom<br/>T top-down · O outlines · R reset</div><div id="status"></div>
</aside><div class="badge">ORIGINAL MATH MESHES · NO IMPORTED MODELS</div>
<script>/* INLINE_GENERATED_CODE */</script>
</body></html>
