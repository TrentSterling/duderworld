<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/><title>DuderWorld 0.5.0 | Soft social rooms</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#e8f4ed;color-scheme:dark}
*{box-sizing:border-box}body,html{padding:0;margin:0;width:100%;height:100%;background:#a8ddeb;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
aside{position:fixed;top:20px;left:20px;width:310px;max-height:calc(100vh - 40px);overflow:auto;border:1px solid #bfd8c930;border-radius:24px;padding:22px;background:#173a43f2;box-shadow:0 14px 50px #17374933;scrollbar-width:thin}
.eyebrow{font:700 10px/1.3 system-ui;letter-spacing:2px;color:#9ad8c9;margin-bottom:12px}
h1{font-size:28px;font-weight:900;letter-spacing:-1.4px;margin:0 0 8px;line-height:1.05}
h1 small{font:700 10px system-ui;letter-spacing:0;color:#173a43;background:#d4e8b4;border-radius:6px;padding:3px 5px;vertical-align:middle;margin-left:4px}
p{margin:0 0 15px;color:#b7ceca;font-size:12px;line-height:1.5}
#stats{font:11px/1.6 ui-monospace,Consolas,monospace;color:#bde3d5;padding:10px 0;border-top:1px solid #bad8ce26;border-bottom:1px solid #bad8ce26;margin:15px 0}
.buttons,.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.places{grid-template-columns:repeat(2,minmax(0,1fr))}
button{padding:10px 5px;color:#e8f4ed;background:#2a5059;border:1px solid #59817e55;border-radius:11px;font:750 10px/1.2 system-ui;letter-spacing:.15px;cursor:pointer}
button:hover{background:#3a686d}button:focus-visible,summary:focus-visible{outline:2px solid #e8c393;outline-offset:3px}
button.primary{background:#ead5af;border-color:#ead5af;color:#24434b}button:disabled{opacity:.55;cursor:wait}
.places button{text-align:left;padding:12px}.places span{display:block;margin-top:4px;color:#9fcac1;font-size:9px;font-weight:500}
details{border-block:1px solid #bad8ce26;margin:16px 0;padding:12px 0}summary{font-size:12px;font-weight:700;cursor:pointer;color:#d7e9de}
.slider{display:grid;grid-template-columns:1fr 44px;font-size:11px;gap:6px 10px;margin:15px 0}.slider output{text-align:right;color:#cae7b6;font:11px ui-monospace,Consolas,monospace}.slider input{grid-column:1/3;width:100%;margin:0;accent-color:#b9d8a4;cursor:pointer}
select{grid-column:1/3;width:100%;background:#28505a;color:#e8f4ed;border:1px solid #59817e55;padding:9px;border-radius:8px}
.readout{font:10px/1.6 system-ui;color:#9dbdb8}#status{margin-top:7px;color:#bad6bf}#hover{min-height:16px;font:700 10px/1.4 system-ui;color:#e8d0a8;margin-top:9px}
.footer{position:fixed;right:20px;bottom:20px;color:#315663;background:#eff6e9e8;padding:10px 15px;border-radius:13px;font:650 11px/1.4 system-ui;letter-spacing:.15px}
@media(max-width:700px){aside{top:10px;left:10px;width:260px;max-height:70vh;padding:16px;border-radius:18px}h1{font-size:24px}.footer{display:none}}
</style></head><body>
<canvas id="screen" aria-label="Interactive DuderWorld connected islands and rounded social rooms"></canvas>
<aside>
<div class="eyebrow">TRONT / WORLD WORKSHOP</div>
<h1>DUDERWORLD <small>0.5.0</small></h1>
<p>Soft rooms. Open sea. A connected place to skate, meet friends and hang out.</p>
<div class="places">
<button id="focusVoice">Voice lounge<span>Rounded conversation room</span></button>
<button id="focusFriends">Friends plaza<span>Garden &amp; tea tables</span></button>
<button id="focusSkate">Skate park<span>Bowls, ramps &amp; rails</span></button>
<button id="focusWorld">Whole world<span>Connected island overview</span></button>
</div>
<div id="stats">Generating archipelago...</div>
<div class="buttons">
<button id="view">TOP DOWN</button><button id="walk">WALK / WASD</button><button id="avatars">DUDERS ON</button>
</div>
<details><summary>Shape the islands</summary>
<label class="slider">Island count <output id="islandCountValue">7</output><input id="islandCount" type="range" min="3" max="12" step="1" value="7"/></label>
<label class="slider">Connections <select id="topology"><option value="radial">Radial</option><option value="ring">Ring + entry</option><option value="chain">Chain</option><option value="hybrid">Hybrid</option></select></label>
<label class="slider">Layout variation <output id="variationValue">0</output><input id="variation" type="range" min="0" max="1" step=".1" value="0"/></label>
<label class="slider">Island separation <output id="spreadValue">1</output><input id="spread" type="range" min=".9" max="1.35" step=".05" value="1"/></label>
<label class="slider">Geometry detail <output id="detailValue">32</output><input id="detail" type="range" min="20" max="48" step="4" value="32"/></label>
<label class="slider">Plant density <output id="greeneryValue">1</output><input id="greenery" type="range" min="0" max="1.5" step=".25" value="1"/></label>
<div class="buttons"><button id="outlines">OUTLINES OFF</button><button id="reroll">REROLL</button><button id="reset">RESET</button></div>
</details>
<div class="buttons"><button id="recipe">SAVE RECIPE</button><button id="metadata" style="grid-column:span 2">UNITY METADATA</button><button class="primary" id="bake" style="grid-column:span 3">BAKE UNITY GLB</button></div>
<div id="hover"></div><div class="readout" id="modeHint"></div><div class="readout" id="status"></div>
</aside>
<div class="footer">Duder Lab characters + DuderWorld environments &nbsp; / &nbsp; 1 unit = 1 metre</div>
<script>/* INLINE_GENERATED_CODE */</script>
</body></html>
