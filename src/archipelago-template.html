<!doctype html>
<!-- Bundled Three.js MIT notice inserted by the build step. -->
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/><title>DuderWorld Archipelago V0.3 — Tront EOS</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#e9f6ee}
*{box-sizing:border-box}body,html{padding:0;margin:0;width:100%;height:100%;background:#a8ddeb;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
aside{position:fixed;top:16px;left:16px;width:min(340px,calc(100vw - 32px));
  border:1px solid #dcf6eb66;border-radius:19px;padding:17px 18px;
  background:#183948ec;backdrop-filter:blur(18px);box-shadow:0 18px 55px #17374977}
h1{font-size:25px;font-weight:950;letter-spacing:-1px;margin:0 0 7px;line-height:1.03}
.tiny{font-size:10px;font-weight:800;letter-spacing:2.1px;color:#93e8e6}
.tag{color:#ffbf9b}p{margin:0 0 12px;color:#c0d6d6;font-size:12px;line-height:1.45}
#stats{font:11px/1.5 ui-monospace,Consolas,monospace;color:#b3ffe7;background:#124751;
padding:9px 11px;border-radius:9px;margin:12px 0}
.slider{display:grid;grid-template-columns:1fr 48px;font-size:12px;gap:4px 10px;
margin:10px 0;font-weight:650}
.slider output{text-align:right;color:#93f3db;font:12px ui-monospace,Consolas,monospace}
.slider input{grid-column:1/3;width:100%;margin:1px;cursor:pointer;accent-color:#66e7d4}
.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:16px 0 11px}
button{padding:9px 4px;color:#eef9f5;background:#275364;border:1px solid #508b94;
border-radius:9px;font:800 10px/1.2 system-ui,Segoe UI,sans-serif;letter-spacing:.12px;cursor:pointer}
button:hover{background:#367488}button:focus-visible{outline:2px solid #ffcf90}
button.primary{background:#f7b896;border-color:#ffe5c7;color:#263c47}
button:disabled{opacity:.58;cursor:wait}
.readout{font:11px/1.65 system-ui;color:#b1d1d2}
#status{color:#90e0cd}#hover{min-height:18px;font-weight:800;color:#fce3a9;font-size:11px}
.footer{position:fixed;right:16px;bottom:17px;background:#edfef3dd;color:#386473;
padding:8px 12px;border-radius:10px;font:800 10px/1.4 system-ui;letter-spacing:.4px}
@media(max-width:700px){aside{top:8px;left:8px;max-height:80vh;overflow:auto;
width:min(286px,calc(100vw - 16px));padding:12px}
h1{font-size:21px}.buttons{gap:4px}button{font-size:9px}.footer{display:none}}
</style></head><body>
<canvas id="screen" aria-label="Interactive Three.js DuderWorld archipelago with seven walkable islands"></canvas>
<aside>
<div class="tiny">TRONT–EOS • PROCEDURAL WORLD</div>
<h1>DUDERWORLD <span class="tag">V0.3</span></h1>
<p>One lobby. Seven connected islands. A giant skate bowl, physics toys,
voice lounge, matchmaking gates, arcade, friends plaza and network lab.</p>
<div id="stats">Generating archipelago...</div>
<label class="slider">Island separation <output id="spreadValue">1</output>
<input id="spread" type="range" min=".9" max="1.25" step=".05" value="1"/></label>
<label class="slider">Geometry detail <output id="detailValue">32</output>
<input id="detail" type="range" min="20" max="48" step="4" value="32"/></label>
<label class="slider">Palm + plant density <output id="greeneryValue">1</output>
<input id="greenery" type="range" min="0" max="1.5" step=".25" value="1"/></label>
<div class="buttons">
<button class="primary" id="view">TOP DOWN</button>
<button id="walk">WALK / WASD</button>
<button id="avatars">DUDERS ON</button>
<button id="outlines">OUTLINES OFF</button>
<button id="reroll">REROLL</button>
<button id="reset">RESET</button>
<button id="recipe">SAVE RECIPE</button>
<button class="primary" id="bake" style="grid-column:span 2">BAKE UNITY GLB</button>
</div>
<div id="hover"></div>
<div class="readout" id="modeHint"></div>
<div class="readout" id="status"></div>
</aside>
<div class="footer">NO ASSET IMPORTS · 1 UNIT = 1 METER · 7 STATIC CULL REGIONS</div>
<script>/* INLINE_GENERATED_CODE */</script>
</body></html>
